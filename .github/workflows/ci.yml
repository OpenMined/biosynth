name: CI

on:
  pull_request:
    branches: [main, develop]
  # Optionally, allow manual trigger for debugging
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Show Rust versions
        run: |
          rustc --version
          cargo --version
          rustfmt --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('cli/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: cli/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('cli/Cargo.lock') }}-v2

      - name: Check formatting
        run: cd cli && cargo fmt -- --check

      - name: Run clippy (all targets)
        run: cd cli && cargo clippy --all-targets --all-features --no-deps -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Show Rust versions
        run: |
          rustc --version
          cargo --version
          rustfmt --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('cli/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('cli/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: cli/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('cli/Cargo.lock') }}-v2

      - name: Run tests
        run: cd cli && cargo test --verbose

      - name: Build
        run: cd cli && cargo build --verbose

  docker-readonly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image (local)
        run: docker build -f docker/Dockerfile -t biosynth:ci .

      - name: Run read-only container
        run: |
          mkdir -p out
          docker run --rm --read-only \
            --tmpfs /tmp:rw,exec,mode=1777 \
            -e BVS_READ_ONLY_DB=1 \
            -v "${{ github.workspace }}/out:/out" \
            biosynth:ci \
            synthetic \
            --output /out/genotypes/{index}.txt \
            --count 1 \
            --seed 42

          docker run --rm --read-only \
            --tmpfs /tmp:rw,exec,mode=1777 \
            -e BVS_READ_ONLY_DB=1 \
            -v "${{ github.workspace }}/out:/out" \
            biosynth:ci \
            genotype-to-vcf \
            --input /out/genotypes/0001.txt \
            --output /out/out.vcf
